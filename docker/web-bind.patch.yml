# Docker overlay: bind all interfaces so `docker run -p` can reach the Web UI.
# Do not use `dsh web --host 0.0.0.0` — the CLI rejects that flag for safety.
# This patch replaces the full webserver config (patches do not deep-merge keys).
- id: webserver
  config:
    host: 0.0.0.0
    port: !!js ctx.webStartup.port ?? 3080
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024
